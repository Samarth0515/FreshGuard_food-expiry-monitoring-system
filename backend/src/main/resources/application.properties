spring.application.name=freshguard-api
server.port=${PORT:8080}

# MySQL Database Configuration (Environment variable driven with defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/freshguard?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

# Jackson camelCase formatting
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration (Environment variable driven secret)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# Default Admin Setup
freshguard.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@123}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Scheduling
spring.task.scheduling.enabled=true

# SpringDoc OpenAPI Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
